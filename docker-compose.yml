# Local development and CI only. Staging and production run PostgreSQL and
# Redis directly on their VPSs (Patroni / Sentinel); see the build plan, section 3.
name: kacheem

services:
  db:
    image: postgres:17.12 # keep in step with the production minor release
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev-only-password # local only, never reused elsewhere
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - default_transaction_isolation=read committed
      - -c
      - lock_timeout=5s
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432" # localhost only; override in .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tickets"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.12.0 # or valkey/valkey; keep in step with production
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - dev-only-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379" # localhost only; override in .env
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-only-redis", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10

  # ---- Local application stack: `make app-up` (profile "app") ----
  api:
    profiles: [app]
    image: golang:1.27.4-bookworm
    user: "${UIDGID:-1000:1000}"
    working_dir: /repo/backend
    command: ["go", "run", "./cmd/api"]
    environment: &goenv
      HOME: /repo/.cache/home
      GOPATH: /repo/.cache/go
      GOCACHE: /repo/.cache/go-build
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://app:dev-only-password@db:5432/tickets?sslmode=disable
      REDIS_URL: redis://:dev-only-redis@redis:6379/0
      API_PUBLIC_LISTEN: tcp:0.0.0.0:8080
      API_STAFF_LISTEN: tcp:0.0.0.0:8081
      PUBLIC_ORIGIN: http://localhost:${WEB_HOST_PORT:-8088}
      # The local fake gateway; no real money. For the bKash sandbox set
      # PAYMENT_PROVIDER=bkash and BKASH_* in a gitignored .env file.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      BKASH_BASE_URL: ${BKASH_BASE_URL:-}
      BKASH_USERNAME: ${BKASH_USERNAME:-}
      BKASH_PASSWORD: ${BKASH_PASSWORD:-}
      BKASH_APP_KEY: ${BKASH_APP_KEY:-}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET:-}
      PAYSTATION_BASE_URL: ${PAYSTATION_BASE_URL:-}
      PAYSTATION_MERCHANT_ID: ${PAYSTATION_MERCHANT_ID:-}
      PAYSTATION_PASSWORD: ${PAYSTATION_PASSWORD:-}
      # Development-only key ("dev-only-ticket-key-not-for-prod"); production
      # keys come from systemd credentials and are backed up offline.
      TICKET_KEY: ${TICKET_KEY:-ZGV2LW9ubHktdGlja2V0LWtleS1ub3QtZm9yLXByb2Q=}
      # The staff scanner (a later milestone) will be served here locally.
      GATE_ORIGIN: ${GATE_ORIGIN:-http://localhost:8089}
      # Development channels: messages appear at http://localhost:8088/dev/outbox
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-fake}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
    volumes: [".:/repo"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    image: golang:1.27.4-bookworm
    user: "${UIDGID:-1000:1000}"
    working_dir: /repo/backend
    command: ["go", "run", "./cmd/worker"]
    environment: *goenv
    volumes: [".:/repo"]
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [app]
    image: nginx:1.30.8-alpine
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:80"
    volumes:
      # Mount the directory, not the file: editors replace files, which would
      # leave the container reading the old copy.
      - ./infra/nginx:/etc/nginx/conf.d:ro
      # Mount the parent: next build replaces out/, which would orphan a direct mount.
      - ./web/buyer:/srv/buyer-app:ro
      - ./.cache/site:/srv/site:ro
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
