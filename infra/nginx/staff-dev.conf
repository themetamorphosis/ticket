# Local development mirror of the VPN-only staff listener (plan section 3).
# Production serves this only through WireGuard, with a DNS-01 certificate;
# here it is http://localhost:8089, which browsers treat as a secure context,
# so the camera works.
server {
    listen 81;
    server_name localhost;

    root /srv/staff-app/out;
    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/conf.d/staff-headers.inc;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $staff_api http://api:8081;

    # The staff API: Go's staff listener, never the buyer one.
    location /api/ {
        proxy_pass $staff_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/staff-headers.inc;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/staff-headers.inc;
    }
}
