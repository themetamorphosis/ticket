# Local development mirror of the public buyer listener (plan section 9,
# "Route ownership"). Production adds TLS, the generated CSP header, rate
# limits and a Unix-socket upstream; the routing is the same.
upstream buyer_api {
    server api:8080;
}

server {
    listen 80;
    server_name localhost;

    root /srv/buyer;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # The published snapshot: short cache so edits appear within seconds.
    location = /event.json {
        alias /srv/site/event.json;
        add_header Cache-Control "public, max-age=5" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Every API path, known or not, belongs to Go, which answers in JSON.
    location /api/ {
        proxy_pass http://buyer_api;
        proxy_http_version 1.1;
        # Trust only this hop: overwrite anything the client sent.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Payment provider returns (and, in development, the fake gateway's page).
    location /payments/ {
        proxy_pass http://buyer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
}
